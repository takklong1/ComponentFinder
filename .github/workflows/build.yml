name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses
        
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          
      - name: Unzip project
        run: |
          unzip ComponentFinder.zip
          if [ -d "ComponentFinder/ComponentFinder" ]; then
            mv ComponentFinder/ComponentFinder/* ComponentFinder/
            rm -rf ComponentFinder/ComponentFinder
          fi
          
      - name: Fix aapt2 path and SDK config
        run: |
          cd ComponentFinder
          # 删除任何残留的 aapt2 硬编码
          sed -i '/aapt2FromMavenOverride/d' gradle.properties 2>/dev/null || true
          # 强制写入正确的 SDK 路径
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          # 验证 build-tools 34.0.0 存在
          ls /usr/local/lib/android/sdk/build-tools/34.0.0/aapt2
          
      - name: Build with Gradle
        run: |
          cd ComponentFinder
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ComponentFinder/app/build/outputs/apk/debug/app-debug.apk
